<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忍術・チャクラ感知</title>
  <!-- 去掉 p5.sound，只保留 p5 + ml5 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #0d0600;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      top: 0;
      bottom: 0;
      width: 5px;
      background: linear-gradient(to bottom, #ff6a00, #8b2500, #ff6a00);
      z-index: 3000;
      box-shadow: 0 0 14px #ff6a00aa;
    }

    body::before {
      left: 0;
    }

    body::after {
      right: 0;
    }

    .corner {
      position: fixed;
      font-size: 1.8em;
      color: rgba(255, 106, 0, 0.2);
      z-index: 2000;
      pointer-events: none;
      font-family: serif;
    }

    .tl {
      top: 8px;
      left: 16px;
    }

    .tr {
      top: 8px;
      right: 16px;
    }

    .bl {
      bottom: 8px;
      left: 16px;
    }

    .br {
      bottom: 8px;
      right: 16px;
    }

    #log {
      position: fixed;
      bottom: 10px;
      left: 16px;
      color: rgba(255, 140, 0, 0.5);
      font-size: 10px;
      z-index: 2000;
      letter-spacing: 2px;
      font-family: monospace;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, #1a0900 0%, #0d0600 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      color: #ff9a40;
      font-family: serif;
    }

    .ring {
      width: 140px;
      height: 140px;
      border: 1.5px solid rgba(255, 106, 0, 0.3);
      border-radius: 50%;
      position: absolute;
      animation: spin 8s linear infinite;
    }

    .ring:nth-child(2) {
      width: 180px;
      height: 180px;
      animation-direction: reverse;
      animation-duration: 11s;
      border-color: rgba(200, 60, 0, 0.2);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .ttl {
      font-size: 2.8em;
      color: #ff6a00;
      text-shadow: 0 0 25px #ff6a00, 0 0 50px #ff3300;
      letter-spacing: 10px;
      margin-bottom: 4px;
    }

    .sub {
      font-size: 0.75em;
      color: rgba(255, 160, 80, 0.65);
      letter-spacing: 5px;
      margin-bottom: 20px;
    }

    #ldmsg {
      font-size: 11px;
      color: rgba(255, 160, 80, 0.55);
      letter-spacing: 3px;
      margin-top: 8px;
    }

    #initBtn {
      display: none;
      background: transparent;
      border: 2px solid #ff6a00;
      color: #ff9a40;
      padding: 11px 36px;
      font-size: 0.95em;
      cursor: pointer;
      letter-spacing: 5px;
      font-family: serif;
      transition: all 0.3s;
      margin-top: 18px;
    }

    #initBtn:hover {
      background: rgba(255, 106, 0, 0.18);
      box-shadow: 0 0 30px #ff6a00;
    }
  </style>
</head>

<body>
  <div class="corner tl">忍</div>
  <div class="corner tr">術</div>
  <div class="corner bl">葉</div>
  <div class="corner br">隠</div>
  <div id="log">待機中…</div>

  <div id="overlay">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ttl">忍術</div>
    <div class="sub">CHAKRA PERCEPTION SYSTEM</div>
    <div id="ldmsg">チャクラエンジン読み込み中…</div>
    <button id="initBtn" onclick="initSys()">印・起動</button>
  </div>

  <script>
    // ── 模式系統 ──
    const MODES = [
      { name: 'NARUTO', c: [255, 106, 0], c2: [255, 200, 60] },
      { name: 'SASUKE', c: [80, 160, 255], c2: [200, 100, 255] },
      { name: 'KYUUBI', c: [210, 30, 30], c2: [255, 180, 30] },
    ];
    let modeIdx = 0;

    let video, handPose, hands = [];
    let isReady = false;
    let smAngle = [0, 0], lastTick = [0, 0];
    let smPos = [{ x: 0, y: 0 }, { x: 0, y: 0 }];
    let modelTimer = 0;
    let glitch = 0;

    // 按鈕
    const btns = [
      { lbl: '印変', tag: 'MODE', x: 40, y: 110, w: 88, h: 36, on: false },
      { lbl: '爆発', tag: 'JUTSU', x: 40, y: 154, w: 88, h: 36, on: false },
    ];

    function setup() {
      createCanvas(windowWidth, windowHeight);
      angleMode(DEGREES);
      handPose = ml5.handPose({ flipped: true, maxHands: 2 }, () => {
        document.getElementById('ldmsg').style.display = 'none';
        document.getElementById('initBtn').style.display = 'block';
        log('準備完了');
      });
    }

    function log(m) { document.getElementById('log').innerText = '忍: ' + m; }

    function initSys() {
      video = createCapture(VIDEO, () => {
        document.getElementById('overlay').style.display = 'none';
        isReady = true;
        log('チャクラ感知起動中…');
        handPose.detectStart(video, r => { hands = r; modelTimer = 0; });
      });
      video.size(640, 480);
      video.hide();
    }

    // ─────────────────────────────────────────
    function draw() {
      background(13, 6, 0);
      if (!isReady) return;

      // ハング検知
      if (++modelTimer > 180) { modelTimer = 0; log('再起動中…'); }

      // glitch
      let gx = glitch > 0 ? random(-10, 10) : 0;
      let gy = glitch > 0 ? random(-4, 4) : 0;
      if (glitch > 0) glitch--;

      // カメラ（軽量：tint 1回のみ）
      let mc = MODES[modeIdx].c;
      push();
      translate(width + gx, gy); scale(-1, 1);
      tint(mc[0], mc[1], mc[2], 38);
      image(video, 0, 0, width, height, 0, 0, 640, 480, COVER);
      pop();

      // 走査線（1本）
      stroke(mc[0], mc[1], mc[2], 20);
      strokeWeight(1);
      line(0, (frameCount * 2) % height, width, (frameCount * 2) % height);

      if (hands && hands.length > 0) {
        for (let h of hands) {
          let ix = map(h.keypoints[8].x, 0, 640, 0, width);
          let iy = map(h.keypoints[8].y, 0, 480, 0, height);
          checkBtns(ix, iy);
          drawSkeleton(h, gx, gy);
          drawTips(h, gx, gy);
          drawDial(h, gx, gy);
          drawCursor(ix, iy);
        }
        if (hands.length === 2) drawLink(gx, gy);
      } else {
        // 無手：文字のみ
        fill(mc[0], mc[1], mc[2], 60 + sin(frameCount * 5) * 40);
        noStroke(); textAlign(CENTER, CENTER); textSize(13);
        text('チャクラ感知中 . . .', width / 2, height / 2);
      }

      drawBtns(gx, gy);
      drawHUD();
    }

    // ── 骨格（1層のみ → 軽い）──
    function drawSkeleton(h, gx, gy) {
      let mc = MODES[modeIdx].c;
      let conns = handPose.getConnections();
      stroke(mc[0], mc[1], mc[2], 120);
      strokeWeight(1.5);
      for (let c of conns) {
        let a = h.keypoints[c[0]], b = h.keypoints[c[1]];
        line(map(a.x, 0, 640, 0, width) + gx, map(a.y, 0, 480, 0, height) + gy,
          map(b.x, 0, 640, 0, width) + gx, map(b.y, 0, 480, 0, height) + gy);
      }
    }

    // ── 指先：食指=螺旋丸，其他=單圈 ──
    function drawTips(h, gx, gy) {
      let mc = MODES[modeIdx].c;
      let mc2 = MODES[modeIdx].c2;
      [4, 8, 12, 16, 20].forEach(idx => {
        let k = h.keypoints[idx];
        let x = map(k.x, 0, 640, 0, width) + gx, y = map(k.y, 0, 480, 0, height) + gy;
        if (idx === 8) {
          // 食指：螺旋丸（二層弧のみ）
          noFill();
          stroke(mc[0], mc[1], mc[2], 180); strokeWeight(1.5);
          arc(x, y, 26, 26, frameCount * 5, frameCount * 5 + 260);
          stroke(mc2[0], mc2[1], mc2[2], 220); strokeWeight(1);
          arc(x, y, 14, 14, frameCount * 5 + 180, frameCount * 5 + 350);
          fill(mc2[0], mc2[1], mc2[2], 230); noStroke();
          circle(x, y, 4);
        } else {
          // 其他指：外圈 + 點
          noFill();
          stroke(mc[0], mc[1], mc[2], 140); strokeWeight(1.5);
          circle(x, y, 16);
          fill(mc2[0], mc2[1], mc2[2], 200); noStroke();
          circle(x, y, 4);
        }
      });
    }

    // ── 写輪眼ダイアル（手首、軽量版）──
    function drawDial(h, gx, gy) {
      let mc = MODES[modeIdx].c;
      let wrist = h.keypoints[0];
      let middle = h.keypoints[9];
      // 手のインデックスを id として smPos/smAngle に入れるが、
      // 単純化のためループ内で手ごとに固定 idx=0 で管理
      let id = 0;
      let tx = map(wrist.x, 0, 640, 0, width), ty = map(wrist.y, 0, 480, 0, height);
      let ang = atan2(middle.y - wrist.y, middle.x - wrist.x) + 90;
      smAngle[id] = lerp(smAngle[id] || 0, ang, 0.15);
      smPos[id].x = lerp(smPos[id].x || tx, tx, 0.2);
      smPos[id].y = lerp(smPos[id].y || ty, ty, 0.2);
      let cx = smPos[id].x + gx, cy = smPos[id].y + gy;

      push();
      translate(cx, cy);
      rotate(smAngle[id]);

      // 外圏
      noFill(); stroke(180, 0, 0, 160); strokeWeight(1.5);
      circle(0, 0, 90);

      // 三勾玉
      for (let m = 0; m < 3; m++) {
        push();
        rotate(m * 120 + frameCount * 2);
        fill(200, 0, 0, 180); noStroke();
        ellipse(28, 0, 12, 8);
        fill(13, 6, 0); circle(28, 0, 5);
        pop();
      }

      // 瞳孔
      fill(16, 0, 0, 220); stroke(180, 0, 0, 160); strokeWeight(1);
      circle(0, 0, 26);
      fill(0); noStroke(); circle(0, 0, 12);

      // 針
      fill(mc[0], mc[1], mc[2], 200); noStroke();
      triangle(52, 0, 42, -4, 42, 4);
      pop();

      // 角度
      fill(255, 200, 60, 160); noStroke();
      textAlign(CENTER, CENTER); textSize(11);
      text(int(smAngle[id]) + '°', cx, cy);
    }

    // ── 螺旋丸カーソル（食指追踪）──
    function drawCursor(tx, ty) {
      let mc = MODES[modeIdx].c;
      let mc2 = MODES[modeIdx].c2;
      let t = frameCount;
      noFill();
      // 外旋
      stroke(mc[0], mc[1], mc[2], 160); strokeWeight(2);
      arc(tx, ty, 36, 36, t * 4, t * 4 + 260);
      // 内旋
      stroke(mc2[0], mc2[1], mc2[2], 200); strokeWeight(1.5);
      arc(tx, ty, 20, 20, t * 4 + 180, t * 4 + 340);
      // 核
      fill(mc2[0], mc2[1], mc2[2], 220); noStroke();
      circle(tx, ty, 5);
      // 衛星×2
      for (let s = 0; s < 2; s++) {
        let a = t * 7 + s * 180;
        fill(mc[0], mc[1], mc[2], 160);
        circle(tx + 15 * cos(a), ty + 15 * sin(a), 3);
      }
    }

    // ── チャクラ連鎖（双手）──
    function drawLink(gx, gy) {
      let mc = MODES[modeIdx].c;
      let p1x = map(hands[0].keypoints[9].x, 0, 640, 0, width) + gx;
      let p1y = map(hands[0].keypoints[9].y, 0, 480, 0, height) + gy;
      let p2x = map(hands[1].keypoints[9].x, 0, 640, 0, width) + gx;
      let p2y = map(hands[1].keypoints[9].y, 0, 480, 0, height) + gy;
      let d = dist(p1x, p1y, p2x, p2y);
      let k = map(d, 80, 700, 1, 0, true);

      stroke(mc[0], mc[1], mc[2], 80 + k * 100);
      strokeWeight(1 + k * 6);
      beginShape(); noFill();
      for (let t = 0; t <= 1; t += 0.06) {
        vertex(lerp(p1x, p2x, t) + sin(t * 360 + frameCount * 5) * k * 14,
          lerp(p1y, p2y, t) + cos(t * 360 + frameCount * 5) * k * 14);
      }
      endShape();

      // 中心光点
      let mx = (p1x + p2x) / 2, my = (p1y + p2y) / 2;
      fill(255, 200, 100, 60 * k); noStroke();
      circle(mx, my, 14 + k * 30);
    }

    // ── ボタン ──
    function checkBtns(x, y) {
      btns.forEach(b => {
        let inside = x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h;
        if (inside && !b.on) {
          b.on = true;
          if (b.tag === 'MODE') modeIdx = (modeIdx + 1) % MODES.length;
          else if (b.tag === 'JUTSU') glitch = 25;
        } else if (!inside) b.on = false;
      });
    }

    function drawBtns(gx, gy) {
      let mc = MODES[modeIdx].c;
      btns.forEach(b => {
        push();
        translate(b.x + gx / 4, b.y + gy / 4);
        noFill(); stroke(mc[0], mc[1], mc[2], b.on ? 255 : 130); strokeWeight(b.on ? 2 : 1);
        rect(0, 0, b.w, b.h, 4);
        if (b.on) { fill(mc[0], mc[1], mc[2], 50); rect(0, 0, b.w, b.h, 4); }
        fill(b.on ? color(255, 240, 200) : color(mc[0], mc[1], mc[2]));
        noStroke(); textAlign(CENTER, CENTER); textSize(12);
        text(b.lbl, b.w / 2, b.h / 2);
        pop();
      });
    }

    function drawHUD() {
      let mc = MODES[modeIdx].c;
      let mc2 = MODES[modeIdx].c2;
      // 右上モード
      fill(mc[0], mc[1], mc[2], 170); noStroke();
      textAlign(RIGHT, TOP); textSize(15);
      text(MODES[modeIdx].name + ' MODE', width - 28, 18);
      textSize(9); fill(mc2[0], mc2[1], mc2[2], 110);
      text('チャクラ型: ' + MODES[modeIdx].name, width - 28, 38);
      // 下部
      fill(mc[0], mc[1], mc[2], 90);
      textAlign(CENTER, BOTTOM); textSize(10);
      text('忍術・チャクラ感知 | M11321008', width / 2, height - 8);
    }

    function windowResized() { resizeCanvas(windowWidth, windowHeight); }
  </script>
</body>

</html>
